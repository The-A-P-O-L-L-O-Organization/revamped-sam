name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Reads the version from the "packageManager" field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check dist/ is not stale
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ differs from 'pnpm build' output."
            echo "::error::Run 'pnpm build' and commit the new dist/ files."
            exit 1
          fi
