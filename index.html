  Revamped SAM (Software Automatic Mouth) — demo page.

  A JavaScript port of "SAM - Software Automatic Mouth"
  (Commodore C64, 1982, Don't Ask Software / SoftVoice, Inc.).

  Code lineage:
    s-macke/SAM (C rewrite)
    -> vidarh/SAM, 8BitPimp/SAM (C refactorings)
    -> discordier/sam (JavaScript port by Christian Schiffler)
    -> Imrane03/better-sam (UI + .wav download feature)
    -> The-A-P-O-L-L-O-Organization/revamped-sam (this fork)

  LEGAL DISCLAIMER: nobody owns the original code; it is a
  reverse-engineered version of a commercial product. The copyright
  to the original SAM program belongs to "Don't Ask Software
  (SoftVoice, Inc.)". See the README for license notes.

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revamped SAM: Software Automatic Mouth</title>
  <style>
    :root {
      --bg: #0f1219;
      --surface: #171c28;
      --surface-2: #1e2536;
      --border: #2b344a;
      --text: #e8ecf4;
      --muted: #9aa5bd;
      --accent: #ffb340;
      --accent-2: #ffd27a;
    }

    * { box-sizing: border-box; }

    body {
      max-width: 46rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin: 1rem 0 0.25rem;
    }

    h1 .accent { color: var(--accent); }

    h2 { text-align: center; font-weight: 400; color: var(--muted); font-size: 1rem; margin: 0 0 1.5rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.25rem 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    hr { border: 0; border-top: 1px solid var(--border); margin: 1rem 0; }

    label {
      display: block;
      width: 100%;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.25rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    input[type=text] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 1rem;
    }

    input[type=text]:focus { outline: 2px solid var(--accent); border-color: transparent; }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      margin-bottom: 0.75rem;
    }

    .buttons {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      flex: 1;
      padding: 0.7rem 1rem;
      border: 0;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.1s ease;
    }

    button:hover { filter: brightness(1.1); }

    button[type=submit][id=fmm2] { background: var(--accent); color: #26170a; }
    button[type=submit][id=fmm]  { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

    footer {
      text-align: center;
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer a { color: var(--accent-2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Revamped <span class="accent">SAM</span> — Software Automatic Mouth</h1>
  <h2>An homage to the 1982 Commodore 64 speech synthesizer</h2>

  <script src="dist/samjs.js"></script>
  <script src="index.js"></script>

  <div class="items">
    <div class="card">
      <label for="speechinput">Text to speak:</label>
      <input size="60" id="speechinput" name="textfield" value="Hello , I am Sam.">
      <hr>
      <label id="pitch-lbl" for="pitch">Pitch: </label>
      <input type="range" id="pitch" min="0" max="255" value="0"/>
      <label id="speed-lbl" for="speed">Speed: </label>
      <input type="range" id="speed" min="1" max="255" value="0"/>
      <label id="mouth-lbl" for="mouth">Mouth: </label>
      <input type="range" id="mouth" min="0" max="255" value="0"/>
      <label id="throat-lbl" for="throat">Throat: </label>
      <input type="range" id="throat" min="0" max="255" value="0"/>
      <div class="buttons">
        <button id="fmm2" type="submit">Preview</button>
        <button id="fmm" type="submit">Download</button>
      </div>
    </div>
  </div>
  <footer>
    <a href="https://github.com/The-A-P-O-L-L-O-Organization/revamped-sam" target="_blank" rel="noopener">GitHub Code</a>
    &middot; More features soon
  </footer>
</body>
</html>
